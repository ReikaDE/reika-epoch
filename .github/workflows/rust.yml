# Reusable workflow for Rust components: formatting, clippy, tests, pins.
name: Rust
on:
  workflow_call:
    inputs:
      system-packages:
        description: Extra Arch packages the build needs (space-separated)
        type: string
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: System packages
        run: |
          pacman -Syu --noconfirm --needed git just rustup clang pkgconf \
            wayland libxkbcommon libinput mesa libdrm seatd systemd-libs ${{ inputs.system-packages }}
          rustup default stable
          rustup component add rustfmt clippy
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ReikaDE/reika-epoch
          path: .reika-epoch
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Pins
        run: |
          mkdir -p /tmp/root && ln -s "$GITHUB_WORKSPACE" "/tmp/root/${GITHUB_REPOSITORY#*/}"
          .reika-epoch/scripts/check-pins.sh /tmp/root
