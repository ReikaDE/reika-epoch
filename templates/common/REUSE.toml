version = 1

# Configuration and metadata files that cannot carry comments, or where a
# header would be noise.
[[annotations]]
path = ["*.json", "*.toml", "*.lock", ".gitignore", ".editorconfig", "*.props", "*.slnx", "*.md", ".github/**"]
precedence = "aggregate"
